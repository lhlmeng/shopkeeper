[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopkeeper-brain"
version = "0.1.0"
description = "Enterprise RAG and Agent knowledge-base service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [
    { name = "shopkeeper" },
]
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "fastapi>=0.115,<1.0",
    "grandalf>=0.8,<1.0",
    "httpx>=0.27,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-openai>=0.2,<1.0",
    "langchain-text-splitters>=0.3,<1.0",
    "langgraph>=0.2,<1.0",
    "mcp>=1.0,<3.0",
    "minio>=7.2,<8.0",
    "openai>=1.40,<3.0",
    "openai-agents>=0.0.6,<1.0",
    "pydantic>=2.8,<3.0",
    "pymilvus[model]>=2.5,<3.0",
    "pymongo>=4.8,<5.0",
    "python-dotenv>=1.0,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "redis>=5.0,<7.0",
    "requests>=2.32,<3.0",
    "sentence-transformers>=3.0,<6.0",
    "torch>=2.4,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2.0",
    "pre-commit>=3.8,<5.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "knowledge/.venv",
    "knowledge/temp_data",
    "knowledge/processor/import_processor/output_dir",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "knowledge/temp_data",
    "knowledge/processor/import_processor/output_dir",
]
